name: Update Homebrew Tap

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]

jobs:
  update-tap:
    # Only run when the Release workflow succeeded
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Get latest release version
        id: version
        run: |
          TAG=$(curl -fsSL "https://api.github.com/repos/Sergeant61/local-privacy-converter/releases/latest" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['tag_name'])")
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT

      - name: Download DMGs and compute SHA256
        id: sha
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ARM_URL="https://github.com/Sergeant61/local-privacy-converter/releases/download/v${VERSION}/Local.Privacy.Converter-${VERSION}-arm64.dmg"
          X64_URL="https://github.com/Sergeant61/local-privacy-converter/releases/download/v${VERSION}/Local.Privacy.Converter-${VERSION}.dmg"

          curl -fL -o arm64.dmg "$ARM_URL"
          curl -fL -o x64.dmg  "$X64_URL"

          echo "arm_sha=$(sha256sum arm64.dmg | cut -d' ' -f1)" >> $GITHUB_OUTPUT
          echo "x64_sha=$(sha256sum x64.dmg  | cut -d' ' -f1)" >> $GITHUB_OUTPUT

      - name: Checkout homebrew-tap
        uses: actions/checkout@v6
        with:
          repository: Sergeant61/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Write cask file
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARM_SHA: ${{ steps.sha.outputs.arm_sha }}
          X64_SHA: ${{ steps.sha.outputs.x64_sha }}
        run: |
          python3 - <<'PYEOF'
          import os

          version = os.environ["VERSION"]
          arm_sha = os.environ["ARM_SHA"]
          x64_sha = os.environ["X64_SHA"]

          cask = f'''\
          cask "local-privacy-converter" do
            version "{version}"

            on_arm do
              sha256 "{arm_sha}"
              url "https://github.com/Sergeant61/local-privacy-converter/releases/download/v#{{version}}/Local.Privacy.Converter-#{{version}}-arm64.dmg"
            end

            on_intel do
              sha256 "{x64_sha}"
              url "https://github.com/Sergeant61/local-privacy-converter/releases/download/v#{{version}}/Local.Privacy.Converter-#{{version}}.dmg"
            end

            name "Local Privacy Converter"
            desc "Privacy-focused offline media converter"
            homepage "https://github.com/Sergeant61/local-privacy-converter"

            app "Local Privacy Converter.app"

            zap trash: [
              "~/Library/Application Support/Local Privacy Converter",
              "~/Library/Preferences/io.lpc.desktop.plist",
              "~/Library/Logs/Local Privacy Converter",
            ]
          end
          '''

          lines = cask.splitlines()
          dedented = "\n".join(line[10:] if line.startswith("          ") else line for line in lines)

          with open("Casks/local-privacy-converter.rb", "w") as f:
              f.write(dedented.lstrip("\n") + "\n")

          print(open("Casks/local-privacy-converter.rb").read())
          PYEOF

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/local-privacy-converter.rb
          git commit -m "chore: bump local-privacy-converter to v${{ steps.version.outputs.version }}"
          git push
